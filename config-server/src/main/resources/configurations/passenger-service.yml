spring:
  application:
    name: passenger-service

  main:
    web-application-type: reactive

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

eureka:
  instance:
    hostname: ${spring.application.name}
  client:
    service-url:
      defaultZone: http://eureka-server:${EUREKA_SERVER_PORT}/eureka

keycloak:
  url: http://keycloak:${KEYCLOAK_PORT}
  realm: ecoride
  admin-client-id: ${ADMIN_CLIENT_ID}
  admin-client-secret: ${KEYCLOAK_ADMIN_SECRET}
  admin-realm: ${ADMIN_REALM}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: car
          uri: http:car-service:${CAR_SERVICE_PORT}
          predicates: 
            - Path=/api/v1/cars/**

management:
  endpoints:
    web:
      exposure:
        include:
        - health
        - info
        - prometheus
      base-path: /actuator
  
  endpoint:
    prometheus:
      access: unrestricted

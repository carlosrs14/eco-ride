spring:
  application:
    name: trip-service

  main: 
    web-application-type: reactive

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${RABBT_MQ_HOST}
    port: ${RABBIT_MQ_PORT}
    username: ${RABBIT_MQ_USER}
    password: ${RABBIT_MQ_PASS}
    virtual-host: /

  cloud:
    stream:
      default:
        contentType: application/json
      bindings:
        reservationRequested-out-0:
          destination: reservation.exchange
        reservationConfirmed-out-0:
          destination: reservation.exchange
        reservationCancelled-out-0:
          destination: reservation.exchange

        paymentAuthorized-in-0:
          destination: payment.exchange
          group: trip-service-group
        paymentFailed-in-0:
          destination: payment.exchange
          group: trip-service-group


eureka:
  instance:
    hostname: ${spring.application.name}
  client:
    service-url:
      defaultZone: http://eureka-server:${EUREKA_SERVER_PORT}/eureka


